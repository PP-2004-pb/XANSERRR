services:
  - type: web
    name: smart-itam-viewer
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_SEED
        value: "false"
      - key: PUBLIC_DEMO
        value: "true"
      - key: PUBLIC_DEMO_DATA_CONFIRMATION
        value: synthetic-only
      - key: VITE_PUBLIC_DEMO
        value: "true"
      - key: VITE_API_URL
        value: /api
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
